name: Actualizar JSON de YouTube

on:
  schedule:
    # Se ejecuta todos los días a las 03:00 AM (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: 
    # Este comando te permite ejecutar el script manualmente desde la web con un clic

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scrap.py

      - name: Hacer commit y push del JSON actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add datos_totales_canal.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de vídeos" && git push)
